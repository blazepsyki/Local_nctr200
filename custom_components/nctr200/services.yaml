set_reservation:
  target:
    entity:
      integration: nctr200
      domain: climate
  fields:
    stop_hours:
      required: true
      example: 3
      selector:
        number:
          min: 1
          max: 24
          unit_of_measurement: h
    run_minutes:
      required: true
      example: 20
      selector:
        number:
          min: 10
          max: 90
          unit_of_measurement: min
set_schedule:
  target:
    entity:
      integration: nctr200
      domain: climate
  fields:
    schedule:
      required: true
      example: "00:00-09:00,18:00-24:00"
      selector:
        text:
